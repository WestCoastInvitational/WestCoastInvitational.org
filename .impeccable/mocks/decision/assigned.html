<!doctype html><html><head><meta charset="utf-8"><title>Pit Trade</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
<style>
:root{--navy:#141a33;--ink:#0d1124;--cyan:#2bb5e3;--coral:#f06b7a;--sun:#ff9d4d;--plum:#7a3d6b;--paper:#fff6ea}
*{box-sizing:border-box;margin:0}body{width:1440px;height:900px;overflow:hidden;background:var(--navy);font-family:Archivo;color:var(--paper);position:relative}
.arcs{position:absolute;right:-260px;top:120px;width:1100px;height:1100px;border-radius:50%;background:var(--cyan);box-shadow:inset 0 0 0 0 #000}
.arcs i{position:absolute;border-radius:50%;inset:var(--i);background:var(--c)}
nav{position:absolute;top:28px;left:48px;right:48px;display:flex;align-items:center;gap:28px;font-weight:700;font-size:15px;letter-spacing:.04em;text-transform:uppercase;z-index:5}
nav img{width:52px}nav .sp{flex:1}nav a{color:var(--paper);text-decoration:none}
h1{position:absolute;left:48px;top:150px;font-size:148px;line-height:.86;font-weight:900;font-variation-settings:"wdth" 125;letter-spacing:-.02em;text-transform:uppercase;z-index:3}
h1 span{display:block}h1 .y{color:var(--sun)}
.date{position:absolute;left:52px;top:640px;font-size:30px;font-weight:800;font-variation-settings:"wdth" 110;text-transform:uppercase;z-index:3}
.cta{position:absolute;left:48px;top:720px;background:var(--sun);color:var(--ink);font-weight:900;font-size:26px;padding:22px 34px;border-radius:999px;outline:8px solid var(--paper);transform:rotate(-3deg);text-transform:uppercase;font-variation-settings:"wdth" 115;z-index:4}
.btn{position:absolute;border-radius:50%;background-size:cover;background-position:center;border:10px solid var(--paper);box-shadow:0 18px 30px rgba(0,0,0,.35);z-index:4}
.count{position:absolute;right:120px;top:170px;width:330px;height:330px;border-radius:50%;background:var(--coral);border:12px solid var(--paper);display:grid;place-content:center;text-align:center;transform:rotate(8deg);z-index:5;color:var(--ink)}
.count b{font-size:120px;font-weight:900;line-height:.9;font-variation-settings:"wdth" 125}.count small{font-size:20px;font-weight:800;text-transform:uppercase}
.tag{position:absolute;background:var(--paper);color:var(--ink);font-weight:900;padding:10px 18px;border-radius:14px;font-size:30px;font-variation-settings:"wdth" 125;z-index:6}
</style></head><body>
<div class="arcs"><i style="--i:40px;--c:#2589b8"></i><i style="--i:110px;--c:#24477a"></i><i style="--i:200px;--c:#1c2550"></i><i style="--i:300px;--c:var(--plum)"></i><i style="--i:380px;--c:var(--coral)"></i><i style="--i:460px;--c:var(--sun)"></i></div>
<nav><img src="mark.png" alt=""><span>WCI '27</span><span class="sp"></span><a>Event</a><a>Teams</a><a>Volunteer</a><a>Sponsors</a><a>Travel</a><a>Extras</a></nav>

<div class="cta">Apply for WCI '27 →</div>
<div class="count"><b>265</b><small>days to doors</small></div>
<div class="btn" style="width:260px;height:260px;right:440px;top:470px;background-image:url(robot-12808.jpg);transform:rotate(-6deg)"></div>
<div class="btn" style="width:220px;height:220px;right:150px;top:540px;background-image:url(host-peace.jpg)"></div>
<div class="btn" style="width:170px;height:170px;right:620px;top:300px;background-image:url(robot-23511.jpg)"></div>
<div class="tag" style="right:360px;top:420px;transform:rotate(-10deg)">4053</div>
<div class="tag" style="right:90px;top:510px;transform:rotate(12deg);background:var(--cyan)">23511</div>
<div class="tag" style="right:700px;top:720px;transform:rotate(5deg);background:var(--sun)">BIOBUZZ</div>
</body></html>
